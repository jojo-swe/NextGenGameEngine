name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  repo-sanity:
    name: Repo Sanity Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f vcpkg.json
          test -f MASTERPLAN.md

      - name: Validate JSON files
        run: |
          set -euo pipefail
          python -m json.tool CMakePresets.json > /dev/null
          python -m json.tool vcpkg.json > /dev/null

      - name: Validate CMake availability
        run: cmake --version

  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure_preset: windows-debug
            compiler_flags: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          - os: ubuntu-latest
            configure_preset: linux-debug
            compiler_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      - name: Fetch full vcpkg history for versioned dependencies
        run: python -c "import subprocess; repo=['git','-C','vcpkg']; shallow=subprocess.check_output(repo+['rev-parse','--is-shallow-repository'], text=True).strip(); subprocess.run(repo+['fetch','--unshallow','origin'], check=True) if shallow == 'true' else None"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }} ${{ matrix.compiler_flags }} -DNGE_ENABLE_VULKAN=OFF -DNGE_BUILD_SAMPLES=OFF -DNGE_BUILD_EDITOR=OFF -DNGE_BUILD_TESTS=ON -DVCPKG_MANIFEST_FEATURES=""

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error

  build-and-test-full-windows:
    name: Build and Test Full (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      - name: Fetch full vcpkg history for versioned dependencies
        run: python -c "import subprocess; repo=['git','-C','vcpkg']; shallow=subprocess.check_output(repo+['rev-parse','--is-shallow-repository'], text=True).strip(); subprocess.run(repo+['fetch','--unshallow','origin'], check=True) if shallow == 'true' else None"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (full manifest features)
        run: cmake --preset windows-debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DNGE_ENABLE_VULKAN=OFF -DNGE_BUILD_SAMPLES=ON -DNGE_BUILD_EDITOR=OFF -DNGE_BUILD_TESTS=ON -DVCPKG_MANIFEST_FEATURES="rendering;gameplay"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error
